<title>DUMMIES Text Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&family=Nunito:wght@800;900&display=swap">
<style>
/* Layout: a proofing desk beside the Sound Lab. A sticky console (progress, filters, export); the proposed rule change first; then
   every line the game shows, grouped, each a proof: before, after (editable), an in-game preview, the limits it meets, and the
   decision. The game's faces: B612, B612 Mono for IDs and counts, Nunito Black for the wordmark. Safety yellow is the one call to
   action; aqua is the Corporation's interface; the previews use the game's own night palette in both themes. */
:root {
  --bg: #E6F1F6; --panel: #F7FBFD; --panel-2: #DCEBF2; --ink: #0F1518; --ink-2: #4A5A66; --line: #B9C7CF;
  --aqua: #1A7FA5; --aqua-soft: #CFE9F3; --dummy: #F5C542; --dummy-ink: #1A1D1F; --cone: #D9650B; --warn: #C8392B; --ok: #1F8A5B; --ok-soft: #D4EEE1; --warn-soft: #F6DAD6;
  --g-bg: #0B1322; --g-panel: #101B30; --g-edge: #3FA9D6; --g-ink: #F2F7FA; --g-dim: #8FA6B8; --g-tag: #F5C542; --g-tag-ink: #16130A;
  --shadow: 0 1px 0 rgba(16, 40, 56, 0.06), 0 6px 18px rgba(16, 40, 56, 0.08);
  --f-ui: "B612", "Segoe UI", system-ui, sans-serif; --f-mono: "B612 Mono", ui-monospace, Menlo, Consolas, monospace; --f-brand: "Nunito", "Segoe UI", system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #070A12; --panel: #0F1626; --panel-2: #152038; --ink: #E7F0F5; --ink-2: #93A9B9; --line: #24314C;
  --aqua: #4FC3E8; --aqua-soft: #12324A; --dummy: #F5C542; --dummy-ink: #15130B; --cone: #FF8A1F; --warn: #FF6A5A; --ok: #4FD39A; --ok-soft: #10322A; --warn-soft: #3A1A1A;
  --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #070A12; --panel: #0F1626; --panel-2: #152038; --ink: #E7F0F5; --ink-2: #93A9B9; --line: #24314C;
  --aqua: #4FC3E8; --aqua-soft: #12324A; --dummy: #F5C542; --dummy-ink: #15130B; --cone: #FF8A1F; --warn: #FF6A5A; --ok: #4FD39A; --ok-soft: #10322A; --warn-soft: #3A1A1A;
  --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35); color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--aqua); outline-offset: 2px; }
code, .mono { font-family: var(--f-mono); font-size: 12px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* the console */
.console { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); box-shadow: var(--shadow); }
.console .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 10px; }
.console .row + .row { padding-block: 0 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font: 900 26px/1 var(--f-brand); color: var(--dummy); -webkit-text-stroke: 1px var(--dummy-ink); paint-order: stroke fill; letter-spacing: 0.01em; }
.brand span { font: 700 12px/1 var(--f-mono); letter-spacing: 0.18em; color: var(--ink-2); text-transform: uppercase; }
.meter { display: flex; align-items: center; gap: 10px; margin-left: auto; min-width: 0; flex-wrap: wrap; }
.bar { width: 180px; height: 8px; border-radius: 999px; background: var(--panel-2); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .a { background: var(--ok); } .bar .k { background: var(--aqua); } .bar .e { background: var(--dummy); }
.tally { display: flex; gap: 10px; font: 12px var(--f-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.tally b { color: var(--ink); font-weight: 700; }
.store { font: 11px var(--f-mono); color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.store i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.store.live i { background: var(--ok); }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px; font-size: 13px; line-height: 1.2; color: var(--ink); white-space: nowrap; text-decoration: none; }
.btn:hover { border-color: var(--aqua); }
.btn.primary { background: var(--dummy); color: var(--dummy-ink); border-color: var(--dummy-ink); font-weight: 700; }
.btn.quiet { background: transparent; }
.btn[aria-pressed="true"] { background: var(--aqua-soft); border-color: var(--aqua); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; min-width: 0; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 10px; font: 12px var(--f-ui); color: var(--ink-2); white-space: nowrap; }
.chip b { font: 700 11px var(--f-mono); color: var(--ink); margin-left: 4px; }
.chip[aria-pressed="true"] { background: var(--aqua-soft); border-color: var(--aqua); color: var(--ink); }
.search { flex: 1 1 200px; min-width: 0; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px; }
.sep { width: 1px; align-self: stretch; background: var(--line); }

main { padding-block: 22px 80px; display: grid; gap: 26px; }
.lede { display: grid; gap: 6px; max-width: 76ch; }
.lede h1 { font: 900 30px/1.1 var(--f-brand); }
.lede p { margin: 0; color: var(--ink-2); }
h2.group { font: 700 12px/1 var(--f-mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-2); display: flex; gap: 10px; align-items: center; }
h2.group span { font-weight: 400; letter-spacing: 0.04em; text-transform: none; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
.pill { display: inline-flex; align-items: center; font: 700 10.5px/1 var(--f-mono); letter-spacing: 0.06em; padding: 4px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.pill.lock { border-color: var(--dummy); color: var(--ink); background: color-mix(in srgb, var(--dummy) 22%, transparent); }
.pill.chg { background: var(--cone); border-color: var(--cone); color: #fff; }
.pill.tier { border-style: dashed; }

/* the rule change */
.guide { padding: 16px 18px; display: grid; gap: 10px; border-left: 4px solid var(--dummy); }
.guide h3 { font-size: 16px; }
.guide ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; max-width: 90ch; }
.guide .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* a proof */
.list { display: grid; gap: 10px; }
.proof { display: grid; gap: 10px; padding: 12px 14px; border-left: 4px solid transparent; }
.proof[data-dec="after"] { border-left-color: var(--ok); }
.proof[data-dec="before"] { border-left-color: var(--aqua); }
.proof[data-dec="edit"] { border-left-color: var(--dummy); }
.proof header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; min-width: 0; }
.proof header code { color: var(--ink-2); }
.proof .trig { font-size: 12.5px; color: var(--ink-2); flex: 1 1 260px; min-width: 0; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 0.9fr); gap: 12px; align-items: start; }
.col { display: grid; gap: 6px; min-width: 0; }
.col > span { font: 700 10.5px/1 var(--f-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); }
.before { margin: 0; padding: 8px 10px; border-radius: 8px; background: var(--panel-2); font-size: 14px; overflow-wrap: anywhere; }
.changed .before { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--warn) 70%, transparent); color: var(--ink-2); }
textarea.after { width: 100%; min-height: 54px; resize: vertical; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-size: 14px; line-height: 1.4; }
.unchanged textarea.after { color: var(--ink-2); }
.why { margin: 0; font-size: 12px; color: var(--ink-2); font-style: italic; }
.lint { display: flex; gap: 4px; flex-wrap: wrap; }
.lint span { font: 10.5px/1 var(--f-mono); padding: 3px 6px; border-radius: 6px; background: var(--ok-soft); color: var(--ink); }
.lint span.bad { background: var(--warn-soft); color: var(--warn); font-weight: 700; }
.decide { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.decide .state { font: 11px var(--f-mono); color: var(--ink-2); margin-left: auto; }

/* in-game previews: the game's night palette, in both themes */
.prev { background: var(--g-bg); border-radius: 8px; padding: 12px; display: grid; place-items: center; min-height: 74px; overflow: hidden; }
.bubble { max-width: 240px; padding: 7px 12px; border: 1.5px dashed var(--g-edge); border-radius: 10px; background: var(--g-panel); color: var(--g-ink); font: 700 13.5px/1.25 var(--f-ui); text-align: center; overflow-wrap: anywhere; }
.bubble.shout { border-style: solid; border-color: #FF8A5B; }
.bubble.mutter { color: var(--g-dim); font-weight: 400; }
.bubble.thought { border-radius: 18px; font-style: italic; }
.strip { width: 100%; display: flex; gap: 8px; align-items: center; color: var(--g-ink); font: 13.5px/1.3 var(--f-ui); }
.strip b { flex: none; background: var(--g-tag); color: var(--g-tag-ink); font: 700 11px/1 var(--f-ui); padding: 5px 7px; border-radius: 6px; letter-spacing: 0.04em; }
.strip span { min-width: 0; overflow-wrap: anywhere; }
.card { width: 100%; border: 1px solid var(--g-edge); border-radius: 8px; padding: 10px 12px; color: var(--g-ink); display: grid; gap: 4px; }
.card small { font: 700 10.5px/1 var(--f-ui); color: var(--g-edge); letter-spacing: 0.08em; }
.card p { margin: 0; font: 14px/1.35 var(--f-ui); overflow-wrap: anywhere; }
.label { font: 700 13px/1 var(--f-ui); color: var(--g-tag); letter-spacing: 0.06em; text-align: center; }

.more { justify-self: start; }
.empty { padding: 24px; text-align: center; color: var(--ink-2); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 999px; font-size: 13px; z-index: 40; }
.sheet { position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 70%, transparent); display: grid; place-items: center; padding: 16px; }
.sheet .panel { width: min(760px, 100%); max-height: 86vh; display: grid; gap: 10px; padding: 16px; grid-template-rows: auto auto 1fr auto; }
.sheet textarea { width: 100%; min-height: 240px; font: 12px/1.45 var(--f-mono); border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--panel-2); }
.sheet .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
@media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } .bar { width: 120px; } }
@media (max-width: 700px) { .console { position: static; } .sep { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="console">
  <div class="wrap row">
    <div class="brand"><b>DUMMIES</b><span>Text Lab · P9</span></div>
    <div class="meter">
      <div class="bar" aria-hidden="true"><i class="a" id="bar-a"></i><i class="k" id="bar-k"></i><i class="e" id="bar-e"></i></div>
      <div class="tally" id="tally" aria-live="polite"></div>
      <span class="store" id="store"><i></i><span>Saved in this browser</span></span>
      <button class="btn primary" type="button" id="btn-export">Export decisions</button>
    </div>
  </div>
  <div class="wrap row">
    <div class="chips" id="views" role="group" aria-label="Show"></div>
    <span class="sep" aria-hidden="true"></span>
    <div class="chips" id="groups" role="group" aria-label="Group"></div>
    <input class="search" id="q" type="search" placeholder="Search a line, an id, a trigger" aria-label="Search">
  </div>
</div>

<main class="wrap">
  <section class="lede">
    <h1>Every line the player reads</h1>
    <p id="lede-sub"></p>
  </section>
  <section class="panel guide" id="guide" aria-labelledby="guide-h"></section>
  <div id="list" class="list"></div>
</main>
<div class="toast" id="toast" hidden></div>
<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheet-h">
    <h3 id="sheet-h">Your decisions</h3>
    <p class="why" style="font-style:normal">Copy this and paste it into the chat. It holds only the lines you decided, and the rule change.</p>
    <textarea id="sheet-text" readonly aria-label="Decisions as JSON"></textarea>
    <div class="acts"><button class="btn" type="button" id="sheet-list">Copy as a plain list</button><button class="btn primary" type="button" id="sheet-copy">Copy JSON</button><button class="btn quiet" type="button" id="sheet-close">Close</button></div>
  </div>
</div>

<script>
/*__TEXT_DATA__*/
(function () {
  'use strict';
  const D = window.TEXT_REVIEW, $ = (s, r) => (r || document).querySelector(s), $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const KEY = 'dummies.p9.text.review', ITEMS = D.items, BY = Object.fromEntries(ITEMS.map((it) => [it.id, it]));
  // ---------- state: { guide: 'approve'|'reject'|null, d: { id: { use: 'after'|'before'|'edit', text } } }
  let S = { guide: null, d: {} }, db = null, dirty = false, saveT = 0, writing = false;
  try { const v = JSON.parse(localStorage.getItem(KEY) || 'null'); if (v && v.d) S = v; } catch (e) { /* storage off */ }
  const view = { show: 'changed', group: '', q: '', limit: 60 };

  // ---------- the lint (text/lint.py, in the page)
  const BANNED = ['farsight', 'kill', 'killed', 'kills', 'die', 'died', 'dies', 'dead', 'death', 'deaths', 'player', 'players', 'level', 'levels', 'game', 'games', 'score', 'scores', 'scored', 'respawn', 'respawns', 'respawned', 'lives', 'chongqing', 'tesla', 'toyota', 'byd'];
  const FILL = D.fill || {}, PH = /\{[A-Za-z]+\}/g;
  const filled = (t) => Object.entries(FILL).reduce((a, [k, v]) => a.split(k).join(v), t);
  const words = (t) => (t.match(/[A-Za-z0-9'’{}\-]+/g) || []).length;
  const sentences = (t) => t.replace(/\{[^}]*\}/g, 'X').trim().split(/(?<=[.!?])\s+/).filter((s) => /[A-Za-z]/.test(s)).length;
  function lint(it, t) {
    const out = [], lim = it.limit || {}, ph = [...new Set(t.match(PH) || [])].sort().join(), want = (it.placeholders || []).slice().sort().join();
    if (ph !== want) out.push(['placeholders ' + (want || 'none'), true]);
    const low = t.toLowerCase().replace(/\{[^}]*\}/g, ' ');
    for (const w of BANNED) if (new RegExp('(?<![a-z])' + w + '(?![a-z])').test(low)) out.push(['banned: ' + w, true]);
    if (it.kind === 'chrome') return out;
    if (it.kind === 'bark') {
      out.push([t.length + '/' + (lim.chars || 48) + ' chars', t.length > (lim.chars || 48)]);
      if (!/[.!?]$/.test(t)) out.push(['ends . ! ?', true]);
      if (t.includes('!') && it.style !== 'shout' && it.tier !== '04') out.push(['! only shout or 04', true]);
    } else if (it.kind === 'label') {
      if (it.text.toUpperCase() === it.text && t.toUpperCase() !== t) out.push(['stays caps', true]);
      if (lim.chars) out.push([t.length + '/' + lim.chars + ' chars', t.length > lim.chars]);
    } else {
      if (t.includes('!')) out.push(['no !', true]);
      if (lim.chars) { const n = filled(t).length; out.push([n + '/' + lim.chars + ' chars', n > lim.chars]); }
      if (lim.words) { const n = words(t); out.push([n + (lim.minWords ? '/' + lim.minWords + '–' : '/') + lim.words + ' words', n > lim.words || (lim.minWords && n < lim.minWords)]); }
    }
    if (lim.sentences) { const n = sentences(t); out.push([n + '/' + lim.sentences + ' sentences', n > lim.sentences]); }
    return out;
  }

  // ---------- decisions
  const changed = (it) => it.after !== it.text;
  const decOf = (it) => S.d[it.id] || null;
  const finalText = (it) => { const d = decOf(it); return d ? (d.use === 'before' ? it.text : d.use === 'edit' ? d.text : it.after) : it.after; };
  function decide(id, use, text) {
    const it = BY[id];
    if (use === 'edit' && (text === it.after || text === it.text)) use = text === it.after ? 'after' : 'before';
    S.d[id] = use === 'edit' ? { use, text } : { use };
    save(); renderCount(); paintProof(id);
  }
  function undecide(id) { delete S.d[id]; save(); renderCount(); paintProof(id); }

  // ---------- storage: the artifact's db when this view has it, else this browser
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage off */ }
    if (!db) return;
    dirty = true; clearTimeout(saveT); saveT = setTimeout(flush, 500);
  }
  async function flush() {
    if (!db || writing || !dirty) return;
    writing = true; dirty = false;
    try { await db.doc('review/decisions').set({ guide: S.guide, d: S.d, at: new Date().toISOString(), count: Object.keys(S.d).length }); setStore(true); }
    catch (e) { setStore(false, e && e.code === 'invalid_argument' ? 'Read-only here: saved in this browser' : 'Not saved to the page: kept in this browser'); }
    writing = false; if (dirty) flush();
  }
  function setStore(live, msg) { const s = $('#store'); s.classList.toggle('live', !!live); $('span', s).textContent = msg || (live ? 'Saved with the page' : 'Saved in this browser'); }
  (async () => {
    try {
      if (!window.claude || !window.claude.use) return;
      db = await window.claude.use('db');
      if (!db) return;
      const snap = await db.doc('review/decisions').get();
      if (snap.exists) { const v = snap.data(); const local = Object.keys(S.d).length; S = { guide: v.guide || null, d: Object.assign({}, v.d || {}, local > Object.keys(v.d || {}).length ? S.d : {}) }; }
      setStore(true); renderAll();
      if (Object.keys(S.d).length || S.guide) { dirty = true; flush(); }
    } catch (e) { db = null; }
  })();

  // ---------- previews
  function preview(it, t) {
    const x = esc(filled(t));
    if (it.kind === 'bark') return '<div class="bubble ' + esc(it.style || '') + '">' + x + '</div>';
    if (it.kind === 'label' || it.kind === 'chrome') return '<div class="label">' + x + '</div>';
    if (it.group === 'Feedback' || it.group === 'Objective strip') return '<div class="strip"><b>' + (it.group === 'Feedback' ? 'A2' : 'OBJECTIVE · A2') + '</b><span>' + x + '</span></div>';
    const head = { 'Story': it.id.startsWith('story.tale') ? (it.tile || 'TILE') : it.id.startsWith('story.brief') ? 'TRAINING BRIEF · ' + (it.label || '') : it.id === 'story.ending' ? 'CERTIFIED' : 'ACT', 'Notices': 'DUMMY CORPORATION', 'Endings and screens': 'CONTRACT RESULT' }[it.group] || 'DUMMY CORPORATION';
    return '<div class="card"><small>' + esc(head.toUpperCase()) + '</small><p>' + x + '</p></div>';
  }

  // ---------- render
  function visible() {
    const q = view.q.trim().toLowerCase();
    return ITEMS.filter((it) => {
      if (view.group && it.group !== view.group) return false;
      if (view.show === 'changed' && !changed(it)) return false;
      if (view.show === 'pending' && (!changed(it) || decOf(it))) return false;
      if (view.show === 'decided' && !decOf(it)) return false;
      if (view.show === 'flagged' && !lint(it, finalText(it)).some((l) => l[1])) return false;
      if (q && ![it.id, it.text, it.after, it.trigger, it.why, it.voice].join(' ').toLowerCase().includes(q)) return false;
      return true;
    });
  }
  function proofHtml(it) {
    const d = decOf(it), ch = changed(it), t = finalText(it), L = lint(it, t);
    const pills = ['<span class="pill">' + esc(it.group) + '</span>', it.tier ? '<span class="pill tier">' + esc(it.voice.split(' · ')[0]) + '</span>' : it.kind === 'bark' ? '<span class="pill tier">any tier</span>' : '<span class="pill">' + esc(it.speaker) + '</span>',
      it.style ? '<span class="pill">' + esc(it.style) + '</span>' : '', it.locked ? '<span class="pill lock" title="Lawrence\'s own line (Style Guide V2 U1)">your line</span>' : '', ch ? '<span class="pill chg">changed</span>' : ''].join('');
    const st = d ? (d.use === 'after' ? 'Using the new line' : d.use === 'before' ? 'Keeping the old line' : 'Using your edit') : ch ? 'Not decided' : 'Unchanged';
    return '<article class="panel proof ' + (ch ? 'changed' : 'unchanged') + '" id="p-' + esc(it.id) + '" data-id="' + esc(it.id) + '"' + (d ? ' data-dec="' + d.use + '"' : '') + '>'
      + '<header>' + pills + '<code>' + esc(it.id) + '</code><span class="trig">' + esc(it.trigger) + '</span></header>'
      + '<div class="cols"><div class="col"><span>Before</span><p class="before">' + esc(it.text) + '</p>' + (it.why ? '<p class="why">' + esc(it.why) + '</p>' : '') + '</div>'
      + '<div class="col"><span>After' + (d && d.use === 'edit' ? ' · your edit' : '') + '</span><textarea class="after" id="t-' + esc(it.id) + '" data-id="' + esc(it.id) + '" rows="2" aria-label="New line for ' + esc(it.id) + '">' + esc(t) + '</textarea><div class="lint">' + L.map((l) => '<span class="' + (l[1] ? 'bad' : '') + '">' + esc(l[0]) + '</span>').join('') + '</div></div>'
      + '<div class="col"><span>In game</span><div class="prev">' + preview(it, t) + '</div></div></div>'
      + '<div class="decide">' + (ch || (d && d.use === 'edit') ? '<button class="btn" type="button" data-act="after" aria-pressed="' + !!(d && d.use === 'after') + '">Use the new line</button><button class="btn" type="button" data-act="before" aria-pressed="' + !!(d && d.use === 'before') + '">Keep the old line</button>' : '<button class="btn" type="button" data-act="before" aria-pressed="' + !!(d && d.use === 'before') + '">Keep as is</button>')
      + (d ? '<button class="btn quiet" type="button" data-act="undo">Clear</button>' : '') + '<span class="state">' + st + '</span></div></article>';
  }
  function paintProof(id) { const el = document.getElementById('p-' + id); if (el) { const n = document.createElement('div'); n.innerHTML = proofHtml(BY[id]); el.replaceWith(n.firstChild); } }
  function renderList() {
    const vs = visible(), shown = vs.slice(0, view.limit), groups = [];
    for (const it of shown) { let g = groups.find((x) => x.name === it.group); if (!g) groups.push(g = { name: it.group, items: [] }); g.items.push(it); }
    $('#list').innerHTML = shown.length ? groups.map((g) => '<h2 class="group">' + esc(g.name) + ' <span>' + g.items.length + (vs.length > shown.length ? '+' : '') + '</span></h2>' + g.items.map(proofHtml).join('')).join('')
      + (vs.length > shown.length ? '<button class="btn more" type="button" id="more">Show ' + Math.min(60, vs.length - shown.length) + ' more of ' + (vs.length - shown.length) + '</button>' : '')
      : '<div class="panel empty">Nothing here. Change the filter, or clear the search.</div>';
  }
  function renderCount() {
    const ch = ITEMS.filter(changed), a = ch.filter((i) => decOf(i) && decOf(i).use === 'after').length, k = ITEMS.filter((i) => decOf(i) && decOf(i).use === 'before').length, e = ITEMS.filter((i) => decOf(i) && decOf(i).use === 'edit').length;
    const pend = ch.filter((i) => !decOf(i)).length, n = ch.length || 1;
    $('#bar-a').style.width = (100 * a / n) + '%'; $('#bar-k').style.width = (100 * Math.min(k, n) / n) + '%'; $('#bar-e').style.width = (100 * e / n) + '%';
    $('#tally').innerHTML = '<span><b>' + pend + '</b> to decide</span><span><b>' + a + '</b> new</span><span><b>' + k + '</b> kept</span><span><b>' + e + '</b> edited</span>';
    renderViews();
  }
  function renderViews() {
    const ch = ITEMS.filter(changed);
    const V = [['changed', 'Changed', ch.length], ['pending', 'To decide', ch.filter((i) => !decOf(i)).length], ['decided', 'Decided', Object.keys(S.d).length], ['flagged', 'Over a limit', ITEMS.filter((i) => lint(i, finalText(i)).some((l) => l[1])).length], ['all', 'Every line', ITEMS.length]];
    $('#views').innerHTML = V.map(([k, l, n]) => '<button class="chip" type="button" data-view="' + k + '" aria-pressed="' + (view.show === k) + '">' + l + '<b>' + n + '</b></button>').join('');
    const G = [...new Set(ITEMS.map((i) => i.group))];
    const cnt = (g) => ITEMS.filter((i) => i.group === g && (view.show === 'all' || view.show === 'flagged' || view.show === 'decided' || changed(i))).length;
    $('#groups').innerHTML = '<button class="chip" type="button" data-group="" aria-pressed="' + (!view.group) + '">All groups</button>' + G.filter((g) => cnt(g) || view.group === g).map((g) => '<button class="chip" type="button" data-group="' + esc(g) + '" aria-pressed="' + (view.group === g) + '">' + esc(g) + '<b>' + cnt(g) + '</b></button>').join('');
  }
  function renderGuide() {
    const g = D.guide;
    $('#guide').innerHTML = '<h3 id="guide-h">' + esc(g.title) + '</h3><ul>' + g.rules.map((r) => '<li><b>' + esc(r.id) + '</b> ' + esc(r.text) + '</li>').join('') + '</ul>'
      + '<p class="why" style="font-style:normal">' + esc(g.note) + '</p><div class="acts"><button class="btn" type="button" data-guide="approve" aria-pressed="' + (S.guide === 'approve') + '">Approve the rule change</button><button class="btn" type="button" data-guide="reject" aria-pressed="' + (S.guide === 'reject') + '">Keep V2.9</button><span class="store">' + (S.guide === 'approve' ? 'Approved' : S.guide === 'reject' ? 'Kept V2.9' : 'Not decided') + '</span></div>';
  }
  function renderAll() {
    const ch = ITEMS.filter(changed).length;
    $('#lede-sub').textContent = ITEMS.length + ' lines from Prototype 9: car barks, the Corporation\'s story and notices, toasts, the objective strip, endings and screens, and the interface. ' + ch + ' have a proposed change. Nothing reaches the game until you decide. Use the new line, keep the old one, or type your own in After.';
    renderGuide(); renderCount(); renderList();
  }

  // ---------- events
  document.addEventListener('click', (ev) => {
    const b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.view) { view.show = b.dataset.view; view.limit = 60; renderViews(); renderList(); return; }
    if (b.dataset.group != null && b.closest('#groups')) { view.group = b.dataset.group; view.limit = 60; renderViews(); renderList(); return; }
    if (b.dataset.guide) { S.guide = S.guide === b.dataset.guide ? null : b.dataset.guide; save(); renderGuide(); return; }
    if (b.id === 'more') { view.limit += 60; renderList(); return; }
    if (b.id === 'btn-export') { openSheet(); return; }
    if (b.id === 'sheet-close') { $('#sheet').hidden = true; return; }
    if (b.id === 'sheet-copy') { copy($('#sheet-text').value, 'Copied the JSON'); return; }
    if (b.id === 'sheet-list') { copy(plainList(), 'Copied the list'); return; }
    const p = b.closest('.proof'); if (!p) return;
    const id = p.dataset.id, act = b.dataset.act;
    if (act === 'undo') undecide(id);
    else if (act === 'after' || act === 'before') { const d = decOf(BY[id]); if (d && d.use === act) undecide(id); else decide(id, act); }
  });
  let typeT = 0;
  document.addEventListener('input', (ev) => {
    const t = ev.target;
    if (t.id === 'q') { view.q = t.value; view.limit = 60; clearTimeout(typeT); typeT = setTimeout(renderList, 160); return; }
    if (t.classList.contains('after')) {
      const it = BY[t.dataset.id], v = t.value.replace(/\s*\n\s*/g, ' ');
      const p = t.closest('.proof'); $('.lint', p).innerHTML = lint(it, v).map((l) => '<span class="' + (l[1] ? 'bad' : '') + '">' + esc(l[0]) + '</span>').join(''); $('.prev', p).innerHTML = preview(it, v);
      clearTimeout(typeT); typeT = setTimeout(() => { S.d[it.id] = v === it.after ? { use: 'after' } : v === it.text ? { use: 'before' } : { use: 'edit', text: v }; save(); renderCount(); const pr = document.getElementById('p-' + it.id); if (pr) { pr.dataset.dec = S.d[it.id].use; $('.state', pr).textContent = S.d[it.id].use === 'edit' ? 'Using your edit' : S.d[it.id].use === 'after' ? 'Using the new line' : 'Keeping the old line'; } }, 450);
    }
  });
  function exportObj() {
    const o = { review: 'DUMMIES text review, Prototype 9', guide: S.guide, decisions: {} };
    for (const [id, d] of Object.entries(S.d)) o.decisions[id] = d.use === 'edit' ? { use: 'edit', text: d.text } : { use: d.use };
    return o;
  }
  function plainList() {
    return Object.entries(S.d).map(([id, d]) => { const it = BY[id]; return id + '\n  before: ' + it.text + '\n  ' + (d.use === 'before' ? 'keep' : 'after') + ': ' + (d.use === 'edit' ? d.text : d.use === 'after' ? it.after : it.text); }).join('\n') || 'No decisions yet.';
  }
  function openSheet() { $('#sheet-text').value = JSON.stringify(exportObj(), null, 1); $('#sheet').hidden = false; $('#sheet-copy').focus(); }
  function copy(s, ok) { const done = () => toast(ok); try { navigator.clipboard.writeText(s).then(done, () => { $('#sheet-text').select(); toast('Select the text and copy it'); }); } catch (e) { $('#sheet-text').select(); toast('Select the text and copy it'); } }
  let toastT = 0; function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 1800); }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('#sheet').hidden = true; });
  renderAll();
})();
</script>
